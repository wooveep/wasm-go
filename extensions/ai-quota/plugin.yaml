apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-quota
  namespace: higress-system
spec:
  defaultConfig:
    # ai-quota reads Console-derived Redis balance for admission only.
    # It does not debit Redis after responses.
    redis:
      service_name: redis-service.default.svc.cluster.local
      service_port: 6379
      timeout: 1000
    tenant_header: x-mse-tenant
    consumer_header: x-mse-consumer
    balance_key_template: "billing:balance:{tenant}:{quota_scope}:{consumer}"
    missing_balance_policy: deny
  defaultConfigDisable: false
  matchRules:
  - ingress:
    - qwen
    config:
      quota_scope: route:qwen
  - ingress:
    - deepseek
    config:
      quota_scope: route:deepseek
  phase: UNSPECIFIED_PHASE
  priority: 280
  url: http://higress-plugin-server.higress-system.svc/plugins/ai-quota/1.0.1/plugin.wasm
