apiVersion: 1.0.0
info:
  type: enterprise
  category: ai
  image: platform_wasm/ai-cache
  name: ai-cache
  title: AI 缓存
  x-title-i18n:
    en-US: AI Cache
  description: 薄网关缓存插件，读取 Console 物化的结构化回放记录，执行安全回放并投递 CacheEvent。
  x-description-i18n:
    en-US: Thin gateway cache plugin that reads Console-materialized structured replay records, performs safe replay, and emits CacheEvent.
  iconUrl: https://img.alicdn.com/imgextra/i1/O1CN018iKKih1iVx287RltL_!!6000000004419-2-tps-42-42.png
  readmeUrl: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-cache/README.md
  x-readmeUrl-i18n:
    en-US: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/resources/plugins/ai-cache/README_EN.md
  version: 1.0.0
  contact:
    name: johnlanni
  gatewayMinVersion: "2.0.0"
spec:
  phase: default
  priority: 800
  configSchema:
    openAPIV3Schema:
      title: ai-cache
      type: object
      additionalProperties: false
      properties:
        materialized_lookup:
          type: object
          title: 物化回放查询
          x-title-i18n:
            en-US: Materialized Replay Lookup
          description: 薄缓存模式下从 Redis 读取 Console 预生成的结构化回放记录。
          x-description-i18n:
            en-US: Reads Console-materialized structured replay records from Redis in thin cache mode.
          additionalProperties: false
          properties:
            redis:
              type: object
              title: Redis 物化回放配置
              x-title-i18n:
                en-US: Redis Materialized Replay Configuration
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                  title: 启用 Redis 回放查询
                  x-title-i18n:
                    en-US: Enable Redis Replay Lookup
                  default: false
                service_name:
                  type: string
                  title: Redis 服务名称
                  x-title-i18n:
                    en-US: Redis Service Name
                  description: 存储 Console 物化回放记录的 Redis 服务。
                  x-description-i18n:
                    en-US: Redis service that stores Console-materialized replay records.
                  default: redis-stack-server.dns
                service_port:
                  type: integer
                  title: Redis 服务端口
                  x-title-i18n:
                    en-US: Redis Service Port
                  default: 6379
                key_prefix:
                  type: string
                  title: 回放 Key 前缀
                  x-title-i18n:
                    en-US: Replay Key Prefix
                  default: "cache:materialized:"
                timeout:
                  type: integer
                  title: Redis 超时时间
                  x-title-i18n:
                    en-US: Redis Timeout
                  description: Redis 查询超时时间，单位毫秒。
                  x-description-i18n:
                    en-US: Redis lookup timeout in milliseconds.
                  default: 80
        console_lookup:
          type: object
          title: Console 回源查询
          x-title-i18n:
            en-US: Console Lookup
          description: Redis miss 后可选调用 Console 内部查询接口。
          x-description-i18n:
            en-US: Optional Console internal lookup after Redis miss.
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              title: 启用 Console 查询
              x-title-i18n:
                en-US: Enable Console Lookup
              default: false
            service_name:
              type: string
              title: Console 服务名称
              x-title-i18n:
                en-US: Console Service Name
              default: modelfusion-console-api.dns
            service_port:
              type: integer
              title: Console 服务端口
              x-title-i18n:
                en-US: Console Service Port
              default: 80
            path:
              type: string
              title: 查询路径
              x-title-i18n:
                en-US: Lookup Path
              default: /internal/cache/lookup
            timeout:
              type: integer
              title: Console 超时时间
              x-title-i18n:
                en-US: Console Timeout
              description: Console callout 超时时间，单位毫秒。
              x-description-i18n:
                en-US: Console callout timeout in milliseconds.
              default: 120
        redis_stream:
          type: object
          title: CacheEvent Redis Stream
          x-title-i18n:
            en-US: CacheEvent Redis Stream
          description: 上游响应结束后投递 CacheEvent 的 Redis Stream 目标。
          x-description-i18n:
            en-US: Redis Stream target used to emit CacheEvent after upstream response completion.
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              title: 启用事件投递
              x-title-i18n:
                en-US: Enable Event Emission
              default: false
            service_name:
              type: string
              title: Redis 服务名称
              x-title-i18n:
                en-US: Redis Service Name
              default: redis-stack-server.dns
            service_port:
              type: integer
              title: Redis 服务端口
              x-title-i18n:
                en-US: Redis Service Port
              default: 6379
            stream:
              type: string
              title: Stream 名称
              x-title-i18n:
                en-US: Stream Name
              default: "cache:events"
            field:
              type: string
              title: Stream 字段
              x-title-i18n:
                en-US: Stream Field
              default: event
            timeout:
              type: integer
              title: Redis 超时时间
              x-title-i18n:
                en-US: Redis Timeout
              description: Redis Stream XADD 超时时间，单位毫秒。
              x-description-i18n:
                en-US: Redis Stream XADD timeout in milliseconds.
              default: 120
        route_policy:
          type: object
          title: 路由缓存策略
          x-title-i18n:
            en-US: Route Cache Policy
          description: 控制薄缓存查询、回放、旁路和 memory-aware 缓存行为。
          x-description-i18n:
            en-US: Controls thin cache lookup, replay, bypass, and memory-aware cache behavior.
          additionalProperties: false
          properties:
            enable_redis_lookup:
              type: boolean
              title: 启用 Redis 查询
              x-title-i18n:
                en-US: Enable Redis Lookup
              default: true
            enable_console_lookup:
              type: boolean
              title: 启用 Console 查询
              x-title-i18n:
                en-US: Enable Console Lookup
              default: false
            enable_replay:
              type: boolean
              title: 启用本地回放
              x-title-i18n:
                en-US: Enable Local Replay
              default: true
            enable_bypass:
              type: boolean
              title: 启用缓存旁路
              x-title-i18n:
                en-US: Enable Cache Bypass
              default: false
            enabled_path_suffixes:
              type: array
              title: 生效路径后缀
              x-title-i18n:
                en-US: Enabled Path Suffixes
              description: 允许薄缓存处理的请求路径后缀。为空时不限制路径。
              x-description-i18n:
                en-US: Request path suffixes eligible for thin cache handling. Empty means all paths.
              items:
                type: string
            memory:
              type: object
              title: Memory-aware 缓存策略
              x-title-i18n:
                en-US: Memory-aware Cache Policy
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                  title: 启用记忆感知缓存
                  x-title-i18n:
                    en-US: Enable Memory-aware Cache
                  default: false
                cache_mode:
                  type: string
                  title: 记忆缓存模式
                  x-title-i18n:
                    en-US: Memory Cache Mode
                  enum:
                  - policy_digest
                  - bypass
                  default: policy_digest
                policy_version:
                  type: string
                  title: 记忆策略版本
                  x-title-i18n:
                    en-US: Memory Policy Version
                digest_header:
                  type: string
                  title: 记忆摘要请求头
                  x-title-i18n:
                    en-US: Memory Digest Header
                  default: x-mse-memory-digest
        tenant_header:
          type: string
          title: 租户 Header
          x-title-i18n:
            en-US: Tenant Header
          default: x-mse-tenant
        consumer_header:
          type: string
          title: Consumer Header
          x-title-i18n:
            en-US: Consumer Header
          default: x-mse-consumer
        session_header:
          type: string
          title: Session Header
          x-title-i18n:
            en-US: Session Header
          default: x-openclaw-session-key
        cache_scope:
          type: string
          title: 缓存作用域
          x-title-i18n:
            en-US: Cache Scope
          enum:
          - tenant
          - consumer
          default: tenant
        cache_policy_version:
          type: string
          title: 缓存策略版本
          x-title-i18n:
            en-US: Cache Policy Version
          description: 启用薄缓存查询、回放或事件投递时用于区分 Console 物化策略版本。
          x-description-i18n:
            en-US: Distinguishes Console materialization policy versions when thin cache lookup, replay, or event emission is enabled.
        fail_policy:
          type: string
          title: 失败策略
          x-title-i18n:
            en-US: Failure Policy
          enum:
          - open
          default: open
      required:
      - cache_policy_version
      example:
        materialized_lookup:
          redis:
            enabled: true
            service_name: redis-stack-server.dns
            service_port: 6379
            key_prefix: "cache:materialized:"
            timeout: 80
        console_lookup:
          enabled: true
          service_name: modelfusion-console-api.dns
          service_port: 80
          path: /internal/cache/lookup
          timeout: 120
        redis_stream:
          enabled: true
          service_name: redis-stack-server.dns
          service_port: 6379
          stream: cache:events
          field: event
          timeout: 120
        route_policy:
          enable_redis_lookup: true
          enable_console_lookup: true
          enable_replay: true
          enable_bypass: false
          enabled_path_suffixes:
          - /v1/chat/completions
          memory:
            enabled: true
            cache_mode: policy_digest
            policy_version: memory-policy-v1
            digest_header: x-mse-memory-digest
        tenant_header: x-mse-tenant
        consumer_header: x-mse-consumer
        session_header: x-openclaw-session-key
        cache_scope: consumer
        cache_policy_version: cache-policy-v1
        fail_policy: open
