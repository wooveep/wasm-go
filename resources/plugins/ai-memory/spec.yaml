apiVersion: 1.0.0
info:
  gatewayMinVersion: ""
  type: oss
  category: ai
  image: platform_wasm/ai-memory
  name: ai-memory
  title: AI Memory
  x-title-i18n:
    zh-CN: AI 记忆
  description: Thin gateway memory plugin for request memory injection, response capture, and Redis Stream MemoryEvent emission.
  x-description-i18n:
    zh-CN: 薄网关记忆插件，用于请求记忆注入、响应捕获和 Redis Stream MemoryEvent 投递。
  iconUrl: https://img.alicdn.com/imgextra/i1/O1CN018iKKih1iVx287RltL_!!6000000004419-2-tps-42-42.png
  readmeUrl: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-memory/README.md
  x-readmeUrl-i18n:
    en-US: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/resources/plugins/ai-memory/README_EN.md
  version: 0.1.0
spec:
  phase: default
  priority: 260
  configSchema:
    openAPIV3Schema:
      type: object
      properties:
        redis_stream:
          type: object
          title: Redis Stream配置
          x-title-i18n:
            en-US: Redis Stream Configuration
          description: MemoryEvent Redis Stream XADD target
          required: [service_name]
          properties:
            service_name:
              type: string
              title: 服务名称
              x-title-i18n:
                en-US: Service Name
              default: redis-stack-server.dns
            service_port:
              type: integer
              title: 服务端口
              x-title-i18n:
                en-US: Service Port
              default: 6379
            username:
              type: string
              title: Redis用户名
              x-title-i18n:
                en-US: Redis Username
            password:
              type: string
              title: Redis密码
              x-title-i18n:
                en-US: Redis Password
            database:
              type: integer
              title: Redis数据库
              x-title-i18n:
                en-US: Redis Database
              default: 0
            timeout:
              type: integer
              title: 超时时间
              x-title-i18n:
                en-US: Timeout
              description: Redis call timeout in milliseconds
              default: 500
            stream:
              type: string
              title: Stream名称
              x-title-i18n:
                en-US: Stream Name
              default: memory:events
        recent_cache:
          type: object
          title: Redis最近记忆配置
          x-title-i18n:
            en-US: Redis Recent Memory Configuration
          description: Console-materialized recent memory Redis source
          properties:
            service_name:
              type: string
              default: redis-stack-server.dns
            service_port:
              type: integer
              default: 6379
            username:
              type: string
            password:
              type: string
            database:
              type: integer
              default: 0
            timeout:
              type: integer
              default: 50
            key_prefix:
              type: string
              default: memory:recent
        console_internal:
          type: object
          title: Console内部服务配置
          x-title-i18n:
            en-US: Console Internal Service Configuration
          description: Optional Console assemble callout target
          properties:
            service_name:
              type: string
              default: modelfusion-console-api.dns
            service_port:
              type: integer
              default: 80
            assemble_path:
              type: string
              default: /internal/memory/assemble
            timeout_ms:
              type: integer
              default: 100
            auth_token:
              type: string
              description: Internal bearer token placeholder for Console assemble authorization
        tenant_header:
          type: string
          default: x-mse-tenant
        consumer_header:
          type: string
          default: x-mse-consumer
        session_header:
          type: string
          default: x-mse-session
        request_id_header:
          type: string
          default: x-request-id
        enable_path_suffixes:
          type: array
          items:
            type: string
          default:
          - /v1/chat/completions
          - /v1/messages
        fail_policy:
          type: string
          enum: [open]
          default: open
      required: [redis_stream]
      example:
        # Global external targets and identity defaults belong in defaultConfig.
        redis_stream:
          service_name: redis-stack-server.dns
          service_port: 6379
          username: ""
          password: <redis-password>
          database: 0
          timeout: 500
          stream: memory:events
        recent_cache:
          service_name: redis-stack-server.dns
          service_port: 6379
          username: ""
          password: <redis-password>
          database: 0
          timeout: 50
          key_prefix: memory:recent
        console_internal:
          service_name: modelfusion-console-api.dns
          service_port: 80
          assemble_path: /internal/memory/assemble
          timeout_ms: 100
          auth_token: <internal-bearer-token>
        tenant_header: x-mse-tenant
        consumer_header: x-mse-consumer
        session_header: x-mse-session
        request_id_header: x-request-id
        enable_path_suffixes:
        - /v1/chat/completions
        - /v1/messages
        fail_policy: open
  routeConfigSchema:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      properties:
        memory_mode:
          type: string
          enum: [off, recent-only, digest, semantic]
          default: "off"
        recent_window_turns:
          type: integer
          default: 0
        memory_token_budget:
          type: integer
          default: 0
        assemble_timeout_ms:
          type: integer
          default: 0
        inject_role:
          type: string
          enum: [system, developer]
          default: system
        developer_compatible:
          type: boolean
          default: false
        semantic_top_k:
          type: integer
          default: 0
        capture_response:
          type: boolean
          default: true
        no_store_header:
          type: string
          default: x-higress-ai-memory-no-store
        question_from:
          type: string
          default: messages.@reverse.#(role=="user").content
        response_value_from:
          type: string
          default: choices.0.message.content
        stream_value_from:
          type: string
          default: choices.0.delta.content
        tool_calls_from:
          type: array
          items:
            type: string
          default:
          - choices.0.message.tool_calls
          - choices.0.message.function_call
          - choices.0.delta.tool_calls
          - choices.0.delta.function_call
        policy_version:
          type: string
      example:
        # Route examples map to matchRules[].config and inherit global targets.
        memory_mode: semantic
        recent_window_turns: 6
        memory_token_budget: 1500
        assemble_timeout_ms: 100
        inject_role: system
        developer_compatible: false
        semantic_top_k: 3
        capture_response: true
        no_store_header: x-higress-ai-memory-no-store
        question_from: messages.@reverse.#(role=="user").content
        response_value_from: choices.0.message.content
        stream_value_from: choices.0.delta.content
        tool_calls_from:
        - choices.0.message.tool_calls
        - choices.0.message.function_call
        - choices.0.delta.tool_calls
        - choices.0.delta.function_call
        policy_version: memory-policy-v1
