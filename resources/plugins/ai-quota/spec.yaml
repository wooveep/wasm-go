apiVersion: 1.0.0
info:
  gatewayMinVersion: ""
  type: oss
  category: ai
  image: platform_wasm/ai-quota
  name: ai-quota
  title: AI Monetary Quota
  x-title-i18n:
    zh-CN: AI 金额配额
  description: Perform read-only Redis balance admission for AI requests.
  x-description-i18n:
    zh-CN: 基于只读 Redis 热余额对 AI 请求进行准入检查。
  iconUrl: https://img.alicdn.com/imgextra/i1/O1CN018iKKih1iVx287RltL_!!6000000004419-2-tps-42-42.png
  readmeUrl: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-quota/README.md
  x-readmeUrl-i18n:
    en-US: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-quota/README_EN.md
  version: 1.0.4
  contact:
    name: 2456868764
spec:
  phase: default
  priority: 280
  configSchema:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      properties:
        redis:
          type: object
          additionalProperties: false
          title: Redis配置
          x-title-i18n:
            en-US: Redis Configuration
          description: 只读余额热数据的 Redis 连接配置
          x-description-i18n:
            en-US: Redis connection for read-only balance hot data
          required: [service_name]
          properties:
            service_name:
              type: string
              title: Redis服务名称
              x-title-i18n:
                en-US: Redis Service Name
              description: Redis 服务名称，例如 my-redis.dns 或 redis.my-ns.svc.cluster.local
              x-description-i18n:
                en-US: Redis service name, such as my-redis.dns or redis.my-ns.svc.cluster.local
            service_port:
              type: integer
              title: Redis服务端口
              x-title-i18n:
                en-US: Redis Service Port
              description: Redis 服务端口；static 服务默认为 80，其他默认为 6379
              x-description-i18n:
                en-US: Redis service port; defaults to 80 for static services and 6379 otherwise
              default: 6379
            username:
              type: string
              title: Redis用户名
              x-title-i18n:
                en-US: Redis Username
              description: Redis 用户名
              x-description-i18n:
                en-US: Redis username
            password:
              type: string
              title: Redis密码
              x-title-i18n:
                en-US: Redis Password
              description: Redis 密码
              x-description-i18n:
                en-US: Redis password
            timeout:
              type: integer
              title: Redis连接超时
              x-title-i18n:
                en-US: Redis Connection Timeout
              description: Redis 连接超时时间，单位毫秒
              x-description-i18n:
                en-US: Redis connection timeout in milliseconds
              default: 1000
            database:
              type: integer
              title: Redis数据库
              x-title-i18n:
                en-US: Redis Database
              description: Redis database 编号
              x-description-i18n:
                en-US: Redis database index
              default: 0
        quota_scope:
          type: string
          title: 额度作用域
          x-title-i18n:
            en-US: Quota Scope
          description: 当前路由或规则的额度作用域
          x-description-i18n:
            en-US: Quota scope for the current route or rule
          default: global
        provider:
          type: string
          title: AI Provider
          description: 当前准入上下文的 AI provider 标识
          x-description-i18n:
            en-US: AI provider identifier for the current admission context
          default: default
        tenant_header:
          type: string
          title: 租户请求头
          x-title-i18n:
            en-US: Tenant Header
          description: 租户身份请求头
          x-description-i18n:
            en-US: Request header containing tenant identity
          default: x-mse-tenant
        consumer_header:
          type: string
          title: Consumer请求头
          x-title-i18n:
            en-US: Consumer Header
          description: Consumer 身份请求头
          x-description-i18n:
            en-US: Request header containing consumer identity
          default: x-mse-consumer
        balance_key_template:
          type: string
          title: 余额Key模板
          x-title-i18n:
            en-US: Balance Key Template
          description: Redis 余额 key 模板，支持 {tenant}、{quota_scope}、{consumer}
          x-description-i18n:
            en-US: Redis balance key template supporting {tenant}, {quota_scope}, and {consumer}
          default: "billing:balance:{tenant}:{quota_scope}:{consumer}"
        path_scope:
          type: string
          title: 路径作用域
          x-title-i18n:
            en-US: Path Scope
          description: legacy_suffixes 保留默认 /v1/chat/completions 与 /v1/messages 后缀门控；bound_target 使用已绑定目标，缺省或空过滤器不额外收窄
          x-description-i18n:
            en-US: legacy_suffixes preserves the /v1/chat/completions and /v1/messages default gates; bound_target uses the bound target, with absent or empty filters adding no narrowing
          enum: [legacy_suffixes, bound_target]
          default: legacy_suffixes
        enable_path_suffixes:
          type: array
          title: 生效路径后缀
          x-title-i18n:
            en-US: Enabled Path Suffixes
          description: legacy_suffixes 的路径门控，或 bound_target 的可选非空交集过滤器
          x-description-i18n:
            en-US: Legacy path gating or an optional non-empty intersection filter for bound_target; omission or [] adds no bound-target narrowing
          items:
            type: string
            pattern: '.*\S.*'
        enable_methods:
          type: array
          title: 生效HTTP方法
          x-title-i18n:
            en-US: Enabled HTTP Methods
          description: 可选非空的精确大小写 HTTP 方法交集过滤器
          x-description-i18n:
            en-US: Optional non-empty exact-case HTTP-method intersection filter; omission or [] adds no bound-target narrowing
          items:
            type: string
            pattern: '.*\S.*'
        missing_balance_policy:
          type: string
          title: 余额缺失策略
          x-title-i18n:
            en-US: Missing Balance Policy
          description: 余额 key 缺失时拒绝或放行请求
          x-description-i18n:
            en-US: Deny or allow the request when the balance key is missing
          enum: [deny, allow]
          default: deny
      required: [redis]
      example:
        redis:
          service_name: redis-service.default.svc.cluster.local
          service_port: 6379
          username: <redis-username>
          password: <redis-password>
          timeout: 1000
          database: 0
        quota_scope: global
        provider: default
        tenant_header: x-mse-tenant
        consumer_header: x-mse-consumer
        balance_key_template: "billing:balance:{tenant}:{quota_scope}:{consumer}"
        path_scope: legacy_suffixes
        enable_path_suffixes:
        - /v1/chat/completions
        - /v1/messages
        missing_balance_policy: deny
  routeConfigSchema:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      properties:
        quota_scope:
          type: string
          title: 额度作用域
          x-title-i18n:
            en-US: Quota Scope
          description: 匹配路由的额度作用域
          x-description-i18n:
            en-US: Quota scope for the matched route
        provider:
          type: string
          title: AI Provider
          description: 匹配路由准入上下文的 AI provider 标识
          x-description-i18n:
            en-US: AI provider identifier for the matched admission context
        path_scope:
          type: string
          title: 路径作用域
          x-title-i18n:
            en-US: Path Scope
          description: legacy_suffixes 保留旧后缀门控；bound_target 使用已绑定目标，缺省或空过滤器不额外收窄
          x-description-i18n:
            en-US: legacy_suffixes preserves legacy suffix gating; bound_target uses the bound target, with absent or empty filters adding no narrowing
          enum: [legacy_suffixes, bound_target]
        enable_path_suffixes:
          type: array
          title: 生效路径后缀
          x-title-i18n:
            en-US: Enabled Path Suffixes
          description: 可选非空路径交集过滤器
          x-description-i18n:
            en-US: Optional non-empty path intersection filter; omission or [] adds no bound-target narrowing
          items:
            type: string
            pattern: '.*\S.*'
        enable_methods:
          type: array
          title: 生效HTTP方法
          x-title-i18n:
            en-US: Enabled HTTP Methods
          description: 可选非空的精确大小写 HTTP 方法交集过滤器
          x-description-i18n:
            en-US: Optional non-empty exact-case HTTP-method intersection filter
          items:
            type: string
            pattern: '.*\S.*'
      example:
        quota_scope: route:qwen
        provider: dashscope
        path_scope: bound_target
