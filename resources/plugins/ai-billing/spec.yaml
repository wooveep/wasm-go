apiVersion: 1.0.0
info:
  gatewayMinVersion: ""
  type: oss
  category: ai
  image: platform_wasm/ai-billing
  name: ai-billing
  title: AI Billing Events
  x-title-i18n:
    zh-CN: AI 账单事件
  description: Generate request-level AI billing events through Redis Stream, using provider-authoritative token usage when available, tokenizer-based estimates when usage is absent, and internal_cost events for platform-owned internal AI Routes.
  x-description-i18n:
    zh-CN: 通过 Redis Stream 生成请求级 AI 账单事件，优先使用 provider 上报的 token usage，缺失时使用 tokenizer 估算，并支持内部 AI Route 的 internal_cost 平台成本事件。
  iconUrl: https://img.alicdn.com/imgextra/i1/O1CN018iKKih1iVx287RltL_!!6000000004419-2-tps-42-42.png
  readmeUrl: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-billing/README.md
  x-readmeUrl-i18n:
    en-US: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-billing/README_EN.md
  version: 0.1.1
  contact:
    name: 2456868764
spec:
  phase: default
  priority: 270
  configSchema:
    openAPIV3Schema:
      type: object
      properties:
        redis_stream:
          type: object
          title: Redis Stream配置
          x-title-i18n:
            en-US: Redis Stream Configuration
          description: BillingEvent Redis Stream XADD target
          x-description-i18n:
            en-US: BillingEvent Redis Stream XADD target
          required: [service_name]
          properties:
            service_name:
              type: string
              title: Redis服务名称
              x-title-i18n:
                en-US: Redis Service Name
              description: Redis 服务名或 Console 管理的 MCPBridge 服务名
              x-description-i18n:
                en-US: Redis service name or Console-managed MCPBridge service name
              default: redis-stack-server.dns
            service_port:
              type: integer
              title: Redis服务端口
              x-title-i18n:
                en-US: Redis Service Port
              default: 6379
            username:
              type: string
              title: Redis用户名
              x-title-i18n:
                en-US: Redis Username
            password:
              type: string
              title: Redis密码
              x-title-i18n:
                en-US: Redis Password
              description: Redis 密码，需按敏感字段处理
              x-description-i18n:
                en-US: Redis password. Treat as sensitive
            database:
              type: integer
              title: Redis数据库
              x-title-i18n:
                en-US: Redis Database
              default: 0
            timeout:
              type: integer
              title: Redis超时时间
              x-title-i18n:
                en-US: Redis Timeout
              description: Redis callout 超时时间，单位毫秒
              x-description-i18n:
                en-US: Redis callout timeout in milliseconds
              default: 500
            stream:
              type: string
              title: Stream名称
              x-title-i18n:
                en-US: Stream Name
              default: billing:events
        event_kind:
          type: string
          title: 事件类型
          x-title-i18n:
            en-US: Event Kind
          description: Billing event 类型。customer_usage 用于普通客户用量账单；internal_cost 用于内部 AI Route 的平台成本归因。
          x-description-i18n:
            en-US: Billing event type. customer_usage is for ordinary customer usage billing; internal_cost is for platform-owned internal AI Route cost attribution.
          enum: [customer_usage, internal_cost]
          default: customer_usage
        quota_scope:
          type: string
          title: 额度作用域
          x-title-i18n:
            en-US: Quota Scope
          description: 默认额度作用域，规则级配置可覆盖
          x-description-i18n:
            en-US: Default quota scope. Route rule config can override it
          default: global
        provider:
          type: string
          title: AI Provider
          description: 默认 AI provider 标识，规则级配置可覆盖
          x-description-i18n:
            en-US: Default AI provider identifier. Route rule config can override it
          default: default
        tenant_header:
          type: string
          title: 租户请求头
          x-title-i18n:
            en-US: Tenant Header
          description: 租户身份请求头
          x-description-i18n:
            en-US: Request header containing tenant identity
          default: x-mse-tenant
        consumer_header:
          type: string
          title: Consumer请求头
          x-title-i18n:
            en-US: Consumer Header
          description: Consumer 身份请求头
          x-description-i18n:
            en-US: Request header containing consumer identity
          default: x-mse-consumer
        enable_path_suffixes:
          type: array
          title: 生效路径后缀
          x-title-i18n:
            en-US: Enabled Path Suffixes
          description: 默认生效的 AI 请求路径后缀，规则级配置可覆盖
          x-description-i18n:
            en-US: Default AI request path suffixes enabled for this plugin. Route rule config can override them
          items:
            type: string
          default:
          - /v1/chat/completions
          - /v1/messages
        fail_policy:
          type: string
          title: 投递失败策略
          x-title-i18n:
            en-US: Failure Policy
          description: 投递失败策略，当前支持 open
          x-description-i18n:
            en-US: Delivery failure policy. Currently supports open
          enum: [open]
          default: open
      required: [redis_stream]
      example:
        redis_stream:
          service_name: redis-stack-server.dns
          service_port: 6379
          username: ""
          password: <redis-password>
          database: 0
          timeout: 500
          stream: billing:events
        event_kind: customer_usage
        quota_scope: global
        provider: default
        tenant_header: x-mse-tenant
        consumer_header: x-mse-consumer
        enable_path_suffixes:
        - /v1/chat/completions
        - /v1/messages
        fail_policy: open
  routeConfigSchema:
    openAPIV3Schema:
      type: object
      properties:
        event_kind:
          type: string
          title: 事件类型
          x-title-i18n:
            en-US: Event Kind
          description: 规则级 event_kind 覆盖。内部 AI Route 可配置为 internal_cost，只做平台成本归因。
          x-description-i18n:
            en-US: Rule-level event_kind override. Internal AI Routes can use internal_cost for platform cost attribution only.
          enum: [customer_usage, internal_cost]
          default: customer_usage
        quota_scope:
          type: string
          title: 额度作用域
          x-title-i18n:
            en-US: Quota Scope
          description: 规则级额度作用域覆盖；未配置时继承全局配置
          x-description-i18n:
            en-US: Rule-level quota scope override. Inherits the global config when omitted
          default: global
        provider:
          type: string
          title: AI Provider
          description: 规则级 AI provider 覆盖；未配置时继承全局配置
          x-description-i18n:
            en-US: Rule-level AI provider override. Inherits the global config when omitted
          default: default
        tenant_header:
          type: string
          title: 租户请求头
          x-title-i18n:
            en-US: Tenant Header
          description: 规则级租户身份请求头覆盖；未配置时继承全局配置
          x-description-i18n:
            en-US: Rule-level tenant identity header override. Inherits the global config when omitted
          default: x-mse-tenant
        consumer_header:
          type: string
          title: Consumer请求头
          x-title-i18n:
            en-US: Consumer Header
          description: 规则级 Consumer 身份请求头覆盖；未配置时继承全局配置
          x-description-i18n:
            en-US: Rule-level consumer identity header override. Inherits the global config when omitted
          default: x-mse-consumer
        enable_path_suffixes:
          type: array
          title: 生效路径后缀
          x-title-i18n:
            en-US: Enabled Path Suffixes
          description: 规则级 AI 请求路径后缀覆盖；未配置时继承全局配置
          x-description-i18n:
            en-US: Rule-level enabled AI path suffix override. Inherits the global config when omitted
          items:
            type: string
          default:
          - /v1/chat/completions
          - /v1/messages
        fail_policy:
          type: string
          title: 投递失败策略
          x-title-i18n:
            en-US: Failure Policy
          description: 规则级投递失败策略覆盖，当前支持 open；未配置时继承全局配置
          x-description-i18n:
            en-US: Rule-level delivery failure policy override. Currently supports open and inherits the global config when omitted
          enum: [open]
          default: open
      example:
        event_kind: internal_cost
        quota_scope: internal:ai-memory.digest
        provider: dashscope
